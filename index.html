<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CheetahXpress Recharge – Diamants Free Fire</title>
<style>
:root{color-scheme:dark;--bg:#07101f;--card:#101d32;--card-hover:#152743;--line:#263d5e;--accent:#55c8ff;--accent-dark:#2197df;--text:#f2f7ff;--muted:#a7b6cc;--success:#53df9a;--error:#ff786e;--radius:16px}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#163764 0,transparent 48%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:600px;margin:0 auto;padding:24px 18px 56px}
header{padding:24px 0 18px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.brand h1{margin:0;color:var(--accent);font-size:clamp(28px,7vw,36px);letter-spacing:-1px;line-height:1.1}
.brand svg{width:58px;height:58px;flex:none}
header p{margin:0;color:var(--muted)}
h2{margin:28px 0 12px;font-size:18px}
.packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.pack,.pay button{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--text);font:inherit;cursor:pointer;transition:background .18s ease,border-color .18s ease,transform .18s ease}
.pack{min-height:96px;padding:14px;text-align:left}
.pack:hover,.pay button:hover{background:var(--card-hover)}
.pack b,.pack small,.pack span{display:block}
.pack b{font-size:17px}
.pack small{color:var(--muted)}
.pack span{margin-top:7px;color:var(--accent);font-weight:800}
.pack[aria-pressed="true"],.pay button[aria-pressed="true"]{border-color:var(--accent);background:#123253;box-shadow:0 0 0 1px var(--accent)}
label{display:block;margin-bottom:7px;color:var(--muted);font-size:14px}
input{width:100%;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--text);font:inherit}
input::placeholder{color:#7487a2}
.pay{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pay button{min-height:50px;padding:10px 6px}
.sum{margin-top:24px;padding:17px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,#132744,var(--card))}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.sum .tot{margin-top:10px;padding-top:12px;border-top:1px solid var(--line);color:var(--accent);font-size:19px;font-weight:800}
.go{width:100%;margin-top:14px;padding:16px;border:0;border-radius:var(--radius);background:linear-gradient(110deg,var(--accent),#8ae5ff);color:#061423;font:inherit;font-size:17px;font-weight:850;cursor:pointer;box-shadow:0 8px 24px #35a9ed30}
.go:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.pack:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.msg{min-height:22px;margin-top:12px;color:var(--error);font-size:14px}
.box{display:none;margin-top:16px;padding:18px;border:1px dashed var(--accent-dark);border-radius:var(--radius);background:#0c192b}
.box.show{display:block}
.box ol{padding-left:21px}
.box li{margin:8px 0}
.box code{color:var(--accent);font-weight:800}
.wa{display:block;margin-top:14px;padding:14px;border-radius:12px;background:var(--success);color:#062116;font-weight:850;text-align:center;text-decoration:none}
footer{margin-top:34px;color:var(--muted);font-size:13px;text-align:center}
footer p{margin:6px 0}
footer a{color:var(--accent)}
@media (max-width:380px){.wrap{padding-right:14px;padding-left:14px}.packs{gap:8px}.pack{padding:12px 10px}.pay{gap:7px}}
@media (prefers-reduced-motion:no-preference){.pack:active,.go:active{transform:scale(.98)}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><svg viewBox="0 0 240 240" aria-hidden="true"><defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd8ff"/><stop offset="1" stop-color="#2b7fe0"/></linearGradient>
<radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#12285a"/><stop offset="1" stop-color="#050b18"/></radialGradient>
</defs>
<circle cx="120" cy="120" r="112" fill="url(#bg)" stroke="#3aa8ff" stroke-width="6"/>
<circle cx="120" cy="120" r="101" fill="none" stroke="#1e3a6b" stroke-width="2"/>
<g stroke="#eef4ff" stroke-width="5" stroke-linecap="round" opacity=".85"><path d="M30 150h26"/><path d="M24 166h20"/><path d="M36 182h16"/></g>
<g transform="translate(20 20)">
<path d="M52 62L58 28L88 52Z" fill="#2b7fe0"/><path d="M148 62L142 28L112 52Z" fill="#2b7fe0"/>
<path d="M60 58L63 40L78 53Z" fill="#050b18"/><path d="M140 58L137 40L122 53Z" fill="#050b18"/>
<path d="M100 46C130 46 152 62 154 90C155 114 142 140 121 152L100 164L79 152C58 140 45 114 46 90C48 62 70 46 100 46Z" fill="url(#g)"/>
<path d="M100 100L120 112L112 140L100 148L88 140L80 112Z" fill="#eef4ff" opacity=".9"/>
<path d="M69 88Q82 76 95 89Q82 98 69 88Z" fill="#050b18"/><path d="M131 88Q118 76 105 89Q118 98 131 88Z" fill="#050b18"/>
<circle cx="84" cy="87" r="3.5" fill="#5fd8ff"/><circle cx="116" cy="87" r="3.5" fill="#5fd8ff"/>
<path d="M91 94Q86 120 74 140" stroke="#050b18" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M109 94Q114 120 126 140" stroke="#050b18" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M89 112H111L100 126Z" fill="#050b18"/>
<path d="M100 126V134M100 134Q92 142 85 136M100 134Q108 142 115 136" stroke="#050b18" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<g fill="#050b18"><circle cx="100" cy="62" r="3"/><circle cx="86" cy="66" r="2.5"/><circle cx="114" cy="66" r="2.5"/><circle cx="66" cy="108" r="3"/><circle cx="134" cy="108" r="3"/><circle cx="62" cy="94" r="2.5"/><circle cx="138" cy="94" r="2.5"/></g>
</g></svg><h1>Cheetah Xpress</h1></div>
  <p>Vitès, pouvwa, pèfòmans. Diamants Free Fire livrés sur ton compte.</p>
</header>

<h2>1. Choisis ton pack</h2>
<div class="packs" id="packs"></div>

<h2>2. Ton ID Free Fire</h2>
<label for="uid">ID du joueur (uniquement des chiffres)</label>
<input id="uid" inputmode="numeric" autocomplete="off" placeholder="Ex : 123456789">

<h2>3. Mode de paiement</h2>
<div class="pay" id="pay">
  <button type="button" data-m="natcash" aria-pressed="true">NatCash</button>
  <button type="button" data-m="moncash" aria-pressed="false">MonCash</button>
  <button type="button" data-m="card" aria-pressed="false">Carte</button>
</div>

<div class="sum">
  <div><span>Pack</span><span id="s-pack">–</span></div>
  <div><span>ID joueur</span><span id="s-uid">–</span></div>
  <div class="tot"><span>Total</span><span id="s-tot">–</span></div>
</div>

<button class="go" id="go" disabled>Payer maintenant</button>
<div class="msg" id="msg" role="alert"></div>

<div class="box" id="box"></div>

<footer><p>Livraison après confirmation du paiement.</p><p>WhatsApp : <a href="https://wa.me/50935514145">+509 3551-4145</a><br>E-mail : <a href="mailto:johnstorebusiness01@gmail.com">johnstorebusiness01@gmail.com</a></p></footer>
</div>

<script>
/* ============ CONFIGURATION (modifie seulement cette partie) ============ */
const CONFIG = {
  whatsapp: "50935514145",          // numéro WhatsApp avec indicatif Haïti (509)
  natcashNumber: "+509 3551-4145",   // numéro NatCash qui reçoit l'argent
  monCashNumber: "+509 4490-3997",   // numéro MonCash qui reçoit l'argent
  natcashName: "Cheetah Xpress",     // nom du compte (à confirmer)
  // Lien de paiement carte donné par ton fournisseur (gateway). Laisse vide tant que tu n'en as pas.
  // Chaque lien peut contenir {AMOUNT}, {PACK} et {UID} qui seront remplacés automatiquement.
  cardPaymentLink: ""
};
// Prix en HTG (modifie ici si les prix changent)
const PACKS = [
  {name:"110 Diamants", price:135},
  {name:"341 Diamants", price:387},
  {name:"572 Diamants", price:642},
  {name:"1 166 Diamants", price:1262},
  {name:"2 398 Diamants", price:2408},
  {name:"6 160 Diamants", price:5900},
  {name:"Abonnement semaine", price:370},
  {name:"Abonnement mois", price:1850},
  {name:"Booyah Pass", price:640}
];
/* ====================================================================== */

let sel = null, method = "natcash";
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("fr-FR") + " HTG";

const packsEl = $("packs");
PACKS.forEach((p, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "pack"; b.setAttribute("aria-pressed", "false");
  const label = p.name.includes("Diamants") ? p.name.replace(" Diamants","") : p.name;
  b.innerHTML = "<b></b><small></small><span></span>";
  b.children[0].textContent = label;
  b.children[1].textContent = p.name.includes("Diamants") ? "Diamants" : "Free Fire";
  b.children[2].textContent = fmt(p.price);
  b.onclick = () => { sel = i; [...packsEl.children].forEach((c,j)=>c.setAttribute("aria-pressed", j===i)); update(); };
  packsEl.appendChild(b);
});

document.querySelectorAll("#pay button").forEach(b => b.onclick = () => {
  method = b.dataset.m;
  document.querySelectorAll("#pay button").forEach(x => x.setAttribute("aria-pressed", x===b));
  $("box").classList.remove("show");
});
$("uid").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g,"").slice(0,14); update(); });

function valid(){ return sel !== null && $("uid").value.length >= 6; }
function update(){
  $("s-pack").textContent = sel !== null ? PACKS[sel].name : "–";
  $("s-uid").textContent = $("uid").value || "–";
  $("s-tot").textContent = sel !== null ? fmt(PACKS[sel].price) : "–";
  $("go").disabled = !valid();
  $("msg").textContent = "";
}

function waLink(text){ return "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(text); }

$("go").onclick = () => {
  if (!valid()) return;
  const p = PACKS[sel], uid = $("uid").value, box = $("box");
  box.classList.add("show");
  if (method !== "card") {
    const mn = method === "moncash" ? "MonCash" : "NatCash";
    const num = method === "moncash" ? CONFIG.monCashNumber : CONFIG.natcashNumber;
    box.innerHTML = "<b>Paiement " + mn + "</b><ol>" +
      "<li>Envoie <code></code> sur le compte " + mn + " <code></code> (<span></span>).</li>" +
      "<li>Garde le numéro de transaction.</li>" +
      "<li>Clique sur le bouton vert pour envoyer la preuve. Ta recharge arrive après vérification.</li></ol>" +
      '<a class="wa" target="_blank" rel="noopener">J\'ai payé, envoyer la preuve</a>';
    const c = box.querySelectorAll("code");
    c[0].textContent = fmt(p.price); c[1].textContent = num;
    box.querySelector("span").textContent = CONFIG.natcashName;
    box.querySelector("a").href = waLink("Bonjour CheetahXpress, j'ai payé par " + mn + ".\nPack : " + p.name + "\nMontant : " + fmt(p.price) + "\nID Free Fire : " + uid + "\nNuméro de transaction : ");
  } else {
    if (CONFIG.cardPaymentLink) {
      const url = CONFIG.cardPaymentLink.replace("{AMOUNT}", p.price).replace("{PACK}", encodeURIComponent(p.name)).replace("{UID}", uid);
      window.location.href = url;
      return;
    }
    box.innerHTML = "<b>Paiement par carte</b><p>Le paiement par carte n'est pas encore activé sur ce site. Demande le lien de paiement sécurisé sur WhatsApp.</p>" +
      '<a class="wa" target="_blank" rel="noopener">Demander un lien de paiement</a>';
    box.querySelector("a").href = waLink("Bonjour CheetahXpress, je veux payer par carte.\nPack : " + p.name + "\nMontant : " + fmt(p.price) + "\nID Free Fire : " + uid);
  }
  box.scrollIntoView({behavior:"smooth", block:"nearest"});
};
update();
</script>
</body>
</html>
